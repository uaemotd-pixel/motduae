# Example nginx on AWS Lightsail — same HTTPS origin for Next + Express + Socket.IO.
# Replace your-domain.com and upstream ports to match PM2 / next start.
#
# Critical for live chat: /socket.io must upgrade WebSockets to the Node API
# (backend/server.js), not to the Next.js process.

upstream motd_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream motd_web {
    server 127.0.0.1:3000;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    client_max_body_size 25m;

    # Socket.IO (chatbot, admin support chat, audio-call signaling)
    location /socket.io/ {
        proxy_pass http://motd_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        proxy_pass http://motd_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://motd_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://motd_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
